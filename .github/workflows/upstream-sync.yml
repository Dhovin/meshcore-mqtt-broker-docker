name: Sync Upstream Repository

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add and fetch upstream repository
        run: |
          git remote add upstream https://github.com/michaelhart/meshcore-mqtt-broker.git
          git fetch upstream main

      - name: Sync upstream source files
        run: |
          # Checkout upstream files (src, package manifests, tsconfig)
          git checkout upstream/main -- src/ package.json package-lock.json tsconfig.json 2>/dev/null || true

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ package.json package-lock.json tsconfig.json
          git commit -m "chore(upstream): auto-sync latest changes from michaelhart/meshcore-mqtt-broker"
          git push origin main
